name: Coleta diaria

on:
  schedule:
    # Horario em UTC; Florianopolis e UTC-3 o ano inteiro (sem horario de
    # verao). Marcado para as 06:00 ("0 9"), o robo terminava entre 10h30 e
    # 13h: o GitHub atrasa mais o que esta na hora cheia, quando todo mundo
    # agenda. Por isso o minuto quebrado.
    #
    # 08:17 UTC = 05:17, o horario de verdade.
    - cron: "17 8 * * *"
    # 11:47 UTC = 08:47, a reserva para o dia em que o GitHub pula ou atrasa
    # demais a primeira. Rodar duas vezes nao repete aviso: o que saiu fica
    # marcado (`avisado_em`) no JSON que a primeira commitou, e o
    # `concurrency` abaixo poe uma atras da outra. O repositorio e publico,
    # entao o minuto do Actions nao custa nada.
    - cron: "47 11 * * *"
  workflow_dispatch: {}    # botao "Run workflow" na aba Actions

# Sem isto o GITHUB_TOKEN entra somente-leitura na maioria dos repositorios e
# o push no fim do job falha com 403.
permissions:
  contents: write

# Duas coletas ao mesmo tempo brigariam pelo mesmo commit. A segunda espera.
concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      # Sem `ref`, o checkout pega o commit de quando a execucao foi CRIADA,
      # nao de quando comecou. A reserva das 08:47 que esperou na fila do
      # `concurrency` atras da primeira partiria do JSON de antes dela - sem
      # as marcas de avisado - e repetiria os avisos. Com o `ref`, ele pega a
      # ponta do branch na hora: ja com o commit da primeira.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # mesma versao da maquina local
          cache: pip

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Rodar testes
        run: pytest -q

      # O banco nao vive no repositorio: o que vivem sao os JSON. Aqui eles
      # viram SQLite de novo para a coleta ter contra o que comparar e saber
      # o que e novo de verdade. O `importar` le os dois: os concursos e a
      # linha do tempo.
      #
      # Ele imprime, a cada execucao, quantos favoritos o robo passou a
      # conhecer. Os favoritos chegam aqui pelo `radar sincronizar` que eu
      # rodo na minha maquina: numero menor do que eu esperava e sinal de que
      # faltou sincronizar - nao e erro, e o job segue.
      - name: Reconstruir o banco a partir do JSON
        run: radar importar

      # A CLI sai com codigo 0 mesmo se uma fonte falhar: fonte fora do ar e
      # coisa normal e nao deve pintar o job de vermelho todo dia.
      - name: Coletar
        run: radar coletar

      # Os segredos vem de Settings > Secrets and variables > Actions.
      # Se nao estiverem cadastrados, o comando avisa e sai em paz.
      #
      # Um comando, dois avisos: primeiro o que mudou nos concursos que eu
      # sigo, depois os concursos novos. Este e o UNICO lugar que manda
      # mensagem - na minha maquina o `radar atualizar` roda calado.
      - name: Avisar no Telegram
        env:
          RADAR_TELEGRAM_TOKEN: ${{ secrets.RADAR_TELEGRAM_TOKEN }}
          RADAR_TELEGRAM_CHAT_ID: ${{ secrets.RADAR_TELEGRAM_CHAT_ID }}
        run: radar avisar

      # Edital retificado muda prazo, vaga e requisito. O manifesto guarda o
      # sha256 de cada arquivo, entao da para saber que mudou sem ler o PDF.
      - name: Conferir retificacao de edital
        env:
          RADAR_TELEGRAM_TOKEN: ${{ secrets.RADAR_TELEGRAM_TOKEN }}
          RADAR_TELEGRAM_CHAT_ID: ${{ secrets.RADAR_TELEGRAM_CHAT_ID }}
        run: radar retificacoes --avisar

      - name: Exportar
        run: radar exportar

      - name: Commitar o resultado
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          # O data/provas.json e o manifesto: ao achar edital retificado, o
          # passo de retificacao grava nele o sha novo. Sem commit, a proxima
          # execucao partia do sha velho e avisava a MESMA retificacao de novo
          # - todo dia, e duas vezes no dia com a reserva.
          git add data/concursos.json data/eventos.json data/provas.json

          # O `radar exportar` grava todos os JSON, e o robo so e dono dos tres
          # de cima: os outros (arvore, classificacoes, estudo) nascem na minha
          # maquina. Se o banco reconstruido aqui exporta um deles diferente, o
          # `git pull --rebase` recusa a pasta suja e o job morre com "exit code
          # 128" - foi o que derrubou as duas coletas de 18/10. A diferenca e
          # dado meu fora de sincronia, e nao da coleta: vira aviso no resumo
          # da execucao, e o arquivo volta ao do commit.
          sujos=$(git diff --name-only)
          if [ -n "$sujos" ]; then
            echo "::warning::O exportar mudou arquivo que nao e do robo (descartado):" $sujos
            git checkout -- .
          fi

          if git diff --staged --quiet; then
            echo "Nenhum concurso novo hoje."
            exit 0
          fi

          git commit -m "coleta: $(date -u +%F)"
          # alguem pode ter empurrado enquanto o job rodava
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
