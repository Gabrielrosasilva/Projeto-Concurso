name: Coleta diaria

on:
  schedule:
    # 09:00 UTC = 06:00 em Florianopolis. O Brasil nao tem mais horario de
    # verao, entao UTC-3 vale o ano inteiro.
    - cron: "0 9 * * *"
  workflow_dispatch: {}    # botao "Run workflow" na aba Actions

# Sem isto o GITHUB_TOKEN entra somente-leitura na maioria dos repositorios e
# o push no fim do job falha com 403.
permissions:
  contents: write

# Duas coletas ao mesmo tempo brigariam pelo mesmo commit. A segunda espera.
concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # mesma versao da maquina local
          cache: pip

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Rodar testes
        run: pytest -q

      # O banco nao vive no repositorio: o que vivem sao os JSON. Aqui eles
      # viram SQLite de novo para a coleta ter contra o que comparar e saber
      # o que e novo de verdade. O `importar` le os dois: os concursos e a
      # linha do tempo.
      #
      # Ele imprime, a cada execucao, quantos favoritos o robo passou a
      # conhecer. Os favoritos chegam aqui pelo `radar sincronizar` que eu
      # rodo na minha maquina: numero menor do que eu esperava e sinal de que
      # faltou sincronizar - nao e erro, e o job segue.
      - name: Reconstruir o banco a partir do JSON
        run: radar importar

      # A CLI sai com codigo 0 mesmo se uma fonte falhar: fonte fora do ar e
      # coisa normal e nao deve pintar o job de vermelho todo dia.
      - name: Coletar
        run: radar coletar

      # Os segredos vem de Settings > Secrets and variables > Actions.
      # Se nao estiverem cadastrados, o comando avisa e sai em paz.
      #
      # Um comando, dois avisos: primeiro o que mudou nos concursos que eu
      # sigo, depois os concursos novos. Este e o UNICO lugar que manda
      # mensagem - na minha maquina o `radar atualizar` roda calado.
      - name: Avisar no Telegram
        env:
          RADAR_TELEGRAM_TOKEN: ${{ secrets.RADAR_TELEGRAM_TOKEN }}
          RADAR_TELEGRAM_CHAT_ID: ${{ secrets.RADAR_TELEGRAM_CHAT_ID }}
        run: radar avisar

      # Edital retificado muda prazo, vaga e requisito. O manifesto guarda o
      # sha256 de cada arquivo, entao da para saber que mudou sem ler o PDF.
      - name: Conferir retificacao de edital
        env:
          RADAR_TELEGRAM_TOKEN: ${{ secrets.RADAR_TELEGRAM_TOKEN }}
          RADAR_TELEGRAM_CHAT_ID: ${{ secrets.RADAR_TELEGRAM_CHAT_ID }}
        run: radar retificacoes --avisar

      - name: Exportar
        run: radar exportar

      - name: Commitar o resultado
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/concursos.json data/eventos.json

          if git diff --staged --quiet; then
            echo "Nenhum concurso novo hoje."
            exit 0
          fi

          git commit -m "coleta: $(date -u +%F)"
          # alguem pode ter empurrado enquanto o job rodava
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
