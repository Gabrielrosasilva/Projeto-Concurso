name: Coleta diaria

on:
  schedule:
    # 09:00 UTC = 06:00 em Florianopolis. O Brasil nao tem mais horario de
    # verao, entao UTC-3 vale o ano inteiro.
    - cron: "0 9 * * *"
  workflow_dispatch: {}    # botao "Run workflow" na aba Actions

# Sem isto o GITHUB_TOKEN entra somente-leitura na maioria dos repositorios e
# o push no fim do job falha com 403.
permissions:
  contents: write

# Duas coletas ao mesmo tempo brigariam pelo mesmo commit. A segunda espera.
concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Rodar testes
        run: pytest -q

      # O banco nao vive no repositorio: o que vive e o JSON. Aqui ele vira
      # SQLite de novo para a coleta ter contra o que comparar e saber o que
      # e novo de verdade.
      - name: Reconstruir o banco a partir do JSON
        run: radar importar

      # A CLI sai com codigo 0 mesmo se uma fonte falhar: fonte fora do ar e
      # coisa normal e nao deve pintar o job de vermelho todo dia.
      - name: Coletar
        run: radar coletar

      - name: Exportar
        run: radar exportar

      - name: Commitar o resultado
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/concursos.json

          if git diff --staged --quiet; then
            echo "Nenhum concurso novo hoje."
            exit 0
          fi

          git commit -m "coleta: $(date -u +%F)"
          # alguem pode ter empurrado enquanto o job rodava
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
