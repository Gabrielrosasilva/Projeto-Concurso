semanas:
  1: 'ARRANCADA: 25 questões por noite. Sábado = diagnóstico no radar.'
  2: 40 questões por noite (entra o R+7). Sábado = 1º simulado da semana (30).
  3: '45 por noite. Segunda é feriado: se folgar, faça a meta mínima.'
  4: 50 por noite. Português entra em pronomes; LEP chega nos estabelecimentos.
  5: '50 a 60 por noite (entra o R+30 na quarta). LEP: progressão e remição.'
  6: FECHAMENTO. Sábado 07/11 = simulado de 50 questões no radar.
