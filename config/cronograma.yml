    detalhe: 'Trabalho como dever social e condição de dignidade, fora da CLT (art. 28); remuneração de no mínimo
      3/4 do salário mínimo e sua destinação (art. 29); trabalho interno OBRIGATÓRIO para o condenado a pena privativa
      de liberdade e FACULTATIVO para o preso provisório (art. 31); jornada de 6 a 8 horas, com descanso nos domingos
      e feriados (art. 33); trabalho externo: no fechado, só em serviço ou obra pública, com cautelas e limite de
      10% de presos na obra (art. 36); autorizado pela direção, exige 1/6 da pena cumprida (art. 37).'
