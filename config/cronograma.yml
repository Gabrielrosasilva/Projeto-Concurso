# O cronograma de estudo, dia a dia. Lido pela tela "Hoje" e pelo `radar hoje`.
#
# Gerado a partir da planilha cronograma_policia_penal_sc_ciclo1.xlsx (Ciclo 1,
# 28/09 a 07/11/2026). Pode editar a mao: e dado, nao codigo.
#
# COMO LER
#
#   blocos      - onde cada parte do dia comeca. Os horarios de cada faixa NAO
#                 estao gravados: saem da soma das duracoes a partir do inicio
#                 do bloco. Assim, quando a rampa muda o numero de questoes, o
#                 horario acompanha sozinho.
#   faixa       - uma linha do dia. `duracao` em minutos; OU `questoes`, e ai a
#                 duracao e questoes x `min_por_questao` (padrao:
#                 `minutos_por_questao`), arredondada para cima de 5 em 5.
#   rampa       - o numero de questoes da noite por NIVEL (1 a 6). A faixa com
#                 `rampa: direito` ou `rampa: portugues` usa o numero do nivel
#                 efetivo da semana, e nao o `questoes` gravado (que e o do
#                 plano, quando tudo vai bem).
#   gatilho     - quando o nivel sobe ou desce. Ver src/radar/cronograma.py.
#   opcional    - faixa bonus: aparece, mas nao conta no total do dia.
#   onde        - qconcursos | radar | videoaula (so para o icone da tela).
#   origem      - nas revisoes (R+7, R+30), a data do estudo que esta voltando.

