      contra o sensacionalismo, entrevista com advogado, VISITA do cônjuge, companheira, parentes e amigos, chamamento
      nominal, audiência com o diretor, contato com o mundo exterior, atestado de pena a cumprir. O diretor pode
      SUSPENDER ou RESTRINGIR por ato motivado os incisos V, X e XV (art. 41, parágrafo único). Preso provisório
      e internado (arts. 42 e 43).'
