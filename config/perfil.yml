# Quem eu sou, para o radar cruzar com o que o edital exige.
#
# O radar ja sabe ONDE a prova e aplicada. Com este arquivo ele passa a saber
# se EU sirvo para a vaga, em vez de so mostrar o que o edital pede.
#
# Campo em branco quer dizer "nao sei" - e nao "nao tenho". O radar nunca
# conclui nada a partir de campo vazio: ele diz "a confirmar" e deixa comigo.

# Ano em que eu nasci. Serve para a idade maxima que alguns editais poem -
# concurso de carreira policial costuma ter.
ano_de_nascimento: 2000

# O maior nivel que eu concluí: superior, medio ou fundamental.
escolaridade: superior

# Em que eu me formei. Importa porque muito cargo pede area especifica, e o
# que me serve e o que aceita "superior em qualquer area".
formacao: Sistemas de Informacao

# As categorias de CNH que eu tenho, em lista. Exemplo: [B]
# Vazio = nao tenho, ou nao informei.
cnh: [B]
