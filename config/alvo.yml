# Os cargos que eu quero de verdade, e como reconhece-los no texto do feed.
#
# Este arquivo manda no codigo, como config/regioes.yml: para passar a
# acompanhar um cargo novo, some um bloco aqui e rode `radar reclassificar`.
# Nenhum nome de cargo fica escrito no programa.
#
# Acento e caixa nao importam: o radar normaliza os dois lados antes de
# comparar. A comparacao e por PALAVRA INTEIRA, e isso e proposital - sem
# isso a sigla "SAP" casaria dentro de "Sapezal", "Sapiranga", "Massape" e
# "SAPE/SC", que sao quatro coisas que ja apareceram na coleta de verdade.

# --- o alvo principal -------------------------------------------------------
#
# Bater aqui vale mais que qualquer outra regra: o aviso sai mesmo que o
# concurso esteja longe, mesmo que o texto seja noticia e nao edital, e mesmo
# que o teto de mensagens do dia ja tenha estourado.
#
# O AVISO e o ESTUDO leem este bloco de jeitos diferentes, e essa e a unica
# diferenca que importa aqui:
#
# - para o AVISO, o cargo basta. Policia Penal de qualquer estado me interessa
#   saber: sai com sirene, sem filtro de distancia e sem teto. A marca fica
#   `principal_fora` quando nao ha prova de que o item e de SC;
# - para o ESTUDO - materias, incidencia, treino, acervo - so vale SC. Prova
#   de outro estado e outra banca, outro programa e outra lei estadual:
#   estudar por ela e estudar a materia errada.
#
# Isso vale so para os `termos` (o nome do cargo). Os `orgaos` continuam
# exigindo prova de SC: "SAP" tambem e o nome de uma secretaria de Sao Paulo,
# e sigla solta nao prova estado nenhum.
principal:
  nome: Policia Penal SC

  # So vale para Santa Catarina. Sem prova de que o item e de SC, nao marca -
  # a mesma regra de nunca chutar que vale para o anel de distancia.
  uf: SC

  # Como a secretaria ja se chamou. O orgao e o mesmo dos tres jeitos; o nome
  # mudou duas vezes, e o concurso antigo continua indexado pelo nome da
  # epoca. Conferido no site oficial em 22/09/2026.
  orgaos:
    - SEJURI                                            # o nome de hoje
    - Secretaria de Estado de Justica e Reintegracao Social
    - SAP                                               # o nome em 2019
    - Secretaria de Estado da Administracao Prisional e Socioeducativa
    - SJC                                               # o nome em 2013
    - Secretaria de Estado da Justica e Cidadania
    - DEAP        # Departamento de Administracao Prisional
    - DPP         # Departamento de Policia Penal, onde o cargo mora hoje

  # Como o cargo aparece escrito. "Agente penitenciario" e o nome antigo: foi
  # com ele que as duas edicoes do concurso sairam.
  # O plural entra escrito, e nao por regra: a comparacao e por palavra
  # inteira, entao "policial penal" nao acha "policiais penais". Os tres
  # plurais abaixo sairam de titulos reais da coleta - noticia sobre concurso
  # quase sempre fala no plural ("600 policiais penais"), e era justamente a
  # noticia que eu nao podia perder.
  termos:
    - policia penal
    - policial penal
    - policiais penais
    - agente penitenciario
    - agentes penitenciarios
    # Como o cargo aparece em edital de outros estados e em texto de jornal.
    - agente prisional
    - agentes prisionais

  # A sigla sozinha nao prova estado nenhum: Sao Paulo tambem tem uma
  # secretaria SAP. Quando a fonte nao informa a UF - a FEPESE e a IESES nao
  # informam - e uma destas palavras que decide se o item e de SC.
  prova_de_sc:
    - santa catarina
    - sejuri
    - sap/sc
    - sjc/sc

  # "Policia Penal Federal" casa com "policia penal" e e outro concurso: ele
  # esta na lista de secundarios, no lugar dele.
  exclui:
    - penal federal
    - penais federais

  # Quem organizou as duas vezes que o concurso saiu: FEPESE em 2013 (edital
  # 01/2013 - SJC/SC) e em 2019 (edital 001/SAP/2019). NAO marca alvo
  # sozinha - a FEPESE faz dezenas de concursos de prefeitura por ano. Serve
  # para o aviso lembrar que o padrao de prova ja e conhecido.
  bancas:
    - FEPESE

# --- os alvos secundarios ---------------------------------------------------
#
# A ordem aqui e a ordem do CLAUDE.md, e ela conta: o primeiro bloco que casar
# e o que fica. Bater aqui NAO muda regra nenhuma de aviso - o concurso
# continua sujeito a distancia e ao teto de mensagens. A marca serve para eu
# reconhecer o cargo na lista.
secundarios:
  - nome: Guarda Municipal
    termos:
      - guarda municipal
      - guarda civil municipal

    # As duas Guardas que eu prestaria de verdade. Bater aqui nao promove o
    # bloco a alvo principal: o que muda e que o aviso fura o teto de
    # mensagens do dia, e que a cidade ganha um cartao "De olho" no Meu foco.
    # Guarda Municipal de qualquer outro lugar segue a regra comum.
    de_olho:
      - Balneario Camboriu
      - Florianopolis

  - nome: Policia Civil
    termos:
      - policia civil
      - delegado de policia
      - escrivao de policia
      - investigador de policia
      - agente de policia

  # Antes de "Bombeiro Militar" de proposito: um titulo que cite os dois e
  # sobre o curso de oficial, que e o que eu quero.
  - nome: Oficial de Bombeiros
    termos:
      - oficial de bombeiros
      - oficial bombeiro militar
      - oficial do corpo de bombeiros

  - nome: Policia Penal Federal
    termos:
      - policia penal federal
      - policial penal federal
      # O plural pela mesma razao do bloco principal: sem ele, o titulo que
      # so fala em "policiais penais federais" ficava sem marca nenhuma -
      # excluido do principal, como tem que ser, e sem casar aqui.
      - policiais penais federais

  - nome: Bombeiro Militar
    termos:
      - bombeiro militar
      - corpo de bombeiros

  - nome: Policia Cientifica
    termos:
      - policia cientifica
      - perito criminal
      - perito oficial
      - papiloscopista
      - medico legista
