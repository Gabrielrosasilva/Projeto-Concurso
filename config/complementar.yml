# Os termos que procuram uma materia do edital DENTRO de um caderno
# complementar. Lido por src/radar/servico/complementar.py (Etapa 3B).
#
# POR QUE ISTO EXISTE
#
# No acervo complementar a maioria das provas e de prefeitura, e o caderno
# nao separa Direito Penal de Direito Constitucional: joga tudo num bloco
# "Conhecimentos Especificos" (3.405 questoes) ou "Conhecimentos Gerais".
# Contar so pelo NOME da materia no caderno perderia essas questoes.
#
# O QUE ESTA CONTAGEM VALE, E O QUE NAO VALE
#
# Ela e INDICIO (🟡), nunca evidencia: o termo pode aparecer de passagem, e a
# falta dele nao prova que o assunto nao caiu. Serve para decidir quais
# provas vale a pena classificar - e e a classificacao, questao a questao,
# que diz de verdade qual conteudo caiu. O relatorio mostra as duas colunas
# separadas e nunca as soma.
#
# E DADO: mexer aqui nao muda o banco nem pede migracao. Materia sem termo
# nenhum fica so com a contagem pelo nome.

