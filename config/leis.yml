    o_que_mudou: "o § 12 do art. 129 foi reescrito em incisos e alíneas: o aumento de 1/3 a 2/3 para a lesão dolosa contra integrantes do sistema prisional, no exercício da função ou em decorrência dela, passou para o inciso I, alínea a, e o parágrafo ganhou novas hipóteses (membros do Judiciário, do MP, da Defensoria e da Advocacia Pública, oficiais de justiça e lesão em instituição de ensino, esta com aumento de 2/3 até o dobro no inciso II)"
    anos: [2022]
