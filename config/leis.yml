# --- O que mudou num ponto que nenhuma questao cobra ---------------------------
#
# Os "casos de fronteira" do docs/leis_alteradas.md: o artigo mudou depois da
# prova, mas num ponto que a questao nao cobra - por isso nao ha aviso nela.
# Vale saber deles ao estudar o tema: a ficha mostra o item quando um no dele
# (`nos`) esta no mesmo ramo de um no do tema, ou quando uma marca dele
# (`marcas`) esta no titulo do tema, na mesma materia. Escritos por IA, com a
# procedencia, e por conferir, como os da lista de cima (decisao 84). A
# `fonte` e onde conferir: a compilacao da Camara, ou o Planalto quando a da
# Camara nao foi a usada na conferencia de 03/10.
