# As provas de OUTRAS BANCAS que entram no acervo (decisao 168).
# Lido por src/radar/servico/provas.py: `radar provas --outras-bancas` baixa
# cada caderno (e o gabarito, quando e um PDF a parte) pelo Buscador, que
# respeita o robots.txt e espera entre um pedido e outro; depois
# `radar questoes --banca <banca>` le os cadernos com o leitor da banca.
#
# POR QUE UMA LISTA, E NAO UM RASPADOR
#
# Cada banca publica de um jeito, e o levantamento de 17/10
# (docs/levantamento_de_bancas.md) conferiu caderno por caderno: o robots.txt,
# os termos e a leitura. Uma lista diz exatamente o que entra, e o link de
# cada um - o radar guarda sempre o link original, nunca uma copia de site.
#
# SO ENTRA BANCA CUJO LEITOR EXISTE (`radar/questoes_<banca>.py`, ou o
# `radar/questoes_por_rodada.py` da FGV, da Access, da Idecan e da Selecon
# nova). Prova que o robo nao pode baixar entra pela secao BAIXADAS A MAO, no
# fim (decisao 172).
#
# Campos: banca, ano (o da prova), orgao, uf, cargo, pagina (onde a banca
# lista o concurso; sem ela, o proprio link do caderno), caderno (o PDF) e,
# quando o gabarito e um PDF a parte, gabarito.

provas:
