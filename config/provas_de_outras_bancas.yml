# Selecon: o gabarito e um PDF a parte, e as colunas embaralham a ordem das
# questoes. A materia sai da faixa da capa, copiada aqui em `materias`; o
# bloco "Nocoes de Direito Constitucional e Penal" (21 a 30) foi dividido
# lendo as questoes (21 a 25 sao de Constitucional, 26 a 30 de Penal). E a
# capa poe LEP dentro de "Direitos Humanos" (37 a 40: os conselhos da LEP) e
# de "Legislacao Especial" (44, 54 e 55: direitos, trabalho e egresso), que no
# meu edital e materia propria: lido questao a questao em 17/10.
- banca: Selecon
  ano: 2022
  orgao: Secretaria de Estado de Justiça e Segurança Pública de Minas Gerais (SEJUSP)
  uf: MG
  cargo: Agente de Segurança Penitenciário / Policial Penal
  pagina: https://selecon.org.br/concursos/sejuspmg/
  caderno: https://selecon.org.br/wp-content/uploads/2022/01/Prova-A-AGENTE-DE-SEGURANCA-PENITENCIARIO_-POLICIAL-PENAL.pdf
  gabarito: https://selecon.org.br/wp-content/uploads/2022/01/GABARITO-OFICIAL-PROVA-A.pdf
  materias:
    1-10: Língua Portuguesa
    11-15: Raciocínio Lógico
    16-20: Informática
    21-25: Direito Constitucional
    26-30: Direito Penal
    31-36: Direitos Humanos
    37-40: Lei de Execução Penal
    41-43: Legislação Especial
    44-44: Lei de Execução Penal
    45-53: Legislação Especial
    54-55: Lei de Execução Penal
    56-60: Legislação Especial

# Cebraspe (decisao 169): o caderno autoriza "a reproducao deste material
# apenas para fins didaticos, desde que citada a fonte" - a fonte e o link de
# cada um, guardado no manifesto. O caderno nao diz a materia: `ler` diz so
# QUAIS questoes sao de lei (contadas lendo o comeco de cada enunciado, no
# levantamento de 17/10), e a classificacao escolhe a materia de cada uma
# (`radar classificar --pedido --evidencia fora --genericos`). Certo/Errado
# fica de fora: so treinaria, e ainda nao tem o acerto a parte.
- banca: Cebraspe
  ano: 2022
  orgao: Secretaria Executiva de Ressocialização de Pernambuco (SERES/PE)
  uf: PE
  cargo: Policial Penal
  pagina: https://www.cebraspe.org.br/concursos/SERES_PE_21
  caderno: https://cdn.cebraspe.org.br/concursos/SERES_PE_21/arquivos/671_SERESPE_NS_COM_JUSTIFICATIVA.PDF
  ler: ["21-60"]
  # O gabarito definitivo publicado e do tipo 01, e este caderno e outra
  # versao: em 42 das 60 a letra diverge. A resposta sai da justificativa
  # (a alternativa CERTO), com as anuladas do documento de alteracoes.
  resposta: justificativas
  anuladas: [18, 19, 41]
