# --- BAIXADAS A MAO (decisao 172) --------------------------------------------
# O robo nao pode baixar estas (os termos ou o robots.txt proibem); voce baixa
# no navegador e salva em data/provas/manual/. A entrada diz o link ORIGINAL
# (`caderno`, `gabarito`: e o que o radar guarda e mostra) e o nome do arquivo
# que voce salvou (`arquivo`, `arquivo_do_gabarito`). `radar provas
# --outras-bancas` so registra o arquivo no manifesto.
#
# `versao` e a do caderno baixado: o PDF pode trazer mais de uma (o "PROVA A"
# da PM de Sergipe tem a Prova A e a Prova B), e a letra certa de uma versao
# nao e a da outra - nem a anulada. O radar le so as paginas e o bloco do
# gabarito dessa versao, e recusa o caderno quando nao as acha.
# `cargo_no_pdf`: o texto do cargo, quando o PDF junta varios (a SENAPPEN).
# Cada versao foi conferida na capa e no gabarito em 18/10, e a leitura,
# questao a questao.
