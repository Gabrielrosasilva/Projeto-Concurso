# O link do Qconcursos de cada tema do cronograma (decisao 140).
#
# O Qconcursos nao tem API e os termos dele proibem raspagem: os numeros abaixo
# sairam das listas de assuntos que VOCE copiou do site em 06/10/2026 (F12 >
# Elements > <ul class="q-options">), e o radar so monta o endereco. O nome ao
# lado do numero e o do site, para conferir; quem vale e o numero.
#
# Para corrigir um tema: troque os numeros e o nome (da lista do site). O tema
# e reconhecido pelo titulo da faixa sem o prefixo, sem acento e sem caixa, como
# a ficha. Tema que nao esta aqui continua com o filtro escrito do plano.
#
# `aviso`: quando o assunto do site e mais largo que o tema, a faixa diz o que
# pular - o link traz mais do que voce estudou, e isso nao pode medir calado.
#
# Sem assunto no site (falta a lista da disciplina Redacao Oficial):
#   Redação oficial 1: atributos e tratamento
#   Redação oficial 2: o padrão ofício

# FEPESE (o numero do filtro Banca do site).
banca: 61

# Os numeros das disciplinas no site, para ler os temas. A LEP fica no Direito
