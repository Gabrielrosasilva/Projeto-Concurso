{# Estilo da barra de navegacao do topo. Fica separado do markup porque vai
   dentro do <head> de cada pagina, e o markup vai no <body>.

   As duas metades andam juntas: quem inclui uma inclui a outra. #}
<style>
  .topo-barra{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;
    padding:.6rem 1.25rem;background:var(--cartao);
    border-bottom:1px solid var(--borda);position:sticky;top:0;z-index:20}
  .topo-barra .marca{font-weight:800;letter-spacing:-.02em;margin-right:.6rem;
    color:var(--texto);text-decoration:none;font-size:.95rem}
  .topo-barra a.item{text-decoration:none;padding:.4rem .75rem;border-radius:8px;
    font-size:.88rem;font-weight:600;color:var(--suave)}
  .topo-barra a.item:hover{background:var(--azul-fraco);color:var(--azul)}
  .topo-barra a.item.ativo{background:var(--azul-fraco);color:var(--azul)}

  /* O "Mais" usa <details>, entao abre e fecha sem JavaScript - a mesma
     escolha da caixinha de faixas de salario. */
  .topo-mais{position:relative}
  .topo-mais>summary{list-style:none;cursor:pointer;padding:.4rem .75rem;
    border-radius:8px;font-size:.88rem;font-weight:600;color:var(--suave);
    display:inline-flex;align-items:center;gap:.3rem}
  .topo-mais>summary::-webkit-details-marker{display:none}
  .topo-mais>summary:hover{background:var(--azul-fraco);color:var(--azul)}
  .topo-mais[open]>summary{background:var(--azul-fraco);color:var(--azul)}
  .topo-mais .seta{font-size:.7em;opacity:.7}
  .topo-mais .opcoes{position:absolute;z-index:30;top:calc(100% + .3rem);left:0;
    min-width:11rem;display:flex;flex-direction:column;gap:.15rem;
    background:var(--cartao);border:1px solid var(--borda);border-radius:10px;
    padding:.35rem;box-shadow:0 8px 24px rgba(0,0,0,.12)}
  .topo-mais .opcoes a{text-decoration:none;color:var(--texto);font-size:.85rem;
    padding:.4rem .6rem;border-radius:6px}
  .topo-mais .opcoes a:hover{background:var(--azul-fraco);color:var(--azul)}

  /* Sub-abas de uma secao (Estudar tem Macetes e Simulado). */
  .subabas{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.25rem}
  .subabas a{text-decoration:none;padding:.35rem .8rem;border-radius:999px;
    font-size:.85rem;font-weight:600;border:1px solid var(--borda);
    background:var(--cartao);color:var(--suave)}
  .subabas a:hover{border-color:var(--azul)}
  .subabas a.ativo{border-color:transparent;background:var(--azul-fraco);
    color:var(--azul)}
</style>
