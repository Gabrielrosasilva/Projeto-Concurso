<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }} &middot; Radar de Concursos</title>
  <style>
    :root{
      color-scheme: light dark;
      --fundo:#f5f6f8; --cartao:#fff; --texto:#13161d; --suave:#5c6572;
      --borda:#e3e6eb; --azul:#1d4ed8; --azul-fraco:#e8eeff;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --fundo:#0e1014; --cartao:#171a21; --texto:#e8eaee; --suave:#98a0ae;
        --borda:#262b35; --azul:#7aa2ff; --azul-fraco:#1b2740;
      }
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--fundo);color:var(--texto);
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
    main{max-width:640px;margin:0 auto;padding:4rem 1.25rem}
    .caixa{background:var(--cartao);border:1px dashed var(--borda);
      border-radius:12px;padding:2.5rem 2rem;text-align:center}
    h1{margin:0 0 .5rem;font-size:1.4rem;letter-spacing:-.02em}
    .aviso{display:inline-block;font-size:.75rem;font-weight:700;
      text-transform:uppercase;letter-spacing:.06em;color:var(--azul);
      background:var(--azul-fraco);padding:.2rem .6rem;border-radius:999px;
      margin-bottom:1rem}
    p{color:var(--suave);margin:.6rem 0}
    .volta{display:inline-block;margin-top:1.25rem;color:var(--azul);
      text-decoration:none;font-weight:600}
    .volta:hover{text-decoration:underline}
  </style>
  {% include "_topo_estilo.html" %}
</head>
<body>

{% from "_topo.html" import barra %}
{{ barra(aba) }}

<main>
  <div class="caixa">
    <span class="aviso">Em construcao</span>
    <h1>{{ titulo }}</h1>
    <p>{{ promessa }}</p>
    <p>Esta secao ainda nao faz nada. Ela ja esta no menu porque o lugar dela
      na navegacao esta decidido - o que falta e o conteudo.</p>
    <a class="volta" href="/concursos">Ir para Concursos</a>
  </div>
</main>

</body>
</html>
